<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Somnia — Історія сну</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header class="header">

    <button class="menu-button">✨</button>

    <div class="logo">
        <h1>SOMNIA</h1>
        <p>Better sleep, better you.</p>
    </div>

    <button class="profile-button">👤</button>

</header>


<!-- ==========================
     Бокове меню
========================== -->

<div class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <h2>✨ SOMNIA</h2>
        <p>Better sleep, better you.</p>

    </div>

    <nav>

        <a href="/">🏠 Головна</a>

        <a href="/history">📖 Історія</a>

        <a href="/calendar">📅 Календар</a>

        <a href="/dreams">🌙 Щоденник снів</a>

        <a href="/analytics">📊 Аналітика</a>

        <a href="/goals">🎯 Цілі</a>

        <a href="/settings">⚙️ Налаштування</a>

    </nav>

</div>


<!-- Затемнення -->

<div class="overlay" id="overlay"></div>


<main>

    <section class="welcome-section">

        <div class="welcome-text">

            <h2>📖 Історія сну</h2>

            <p>Усі твої записи про сон</p>

        </div>

    </section>


    <!-- ==========================
         Список записів
    =========================== -->

    <section class="history-section">

        <div id="historyList">

        </div>

    </section>

</main>


<!-- ==========================
     Модальне вікно редагування
========================== -->

<div class="modal" id="editSleepModal">

    <div class="modal-content">

        <h2>✏️ Редагувати запис</h2>

        <label>Дата</label>

        <input
            type="date"
            id="editDate">

        <label>Початок сну</label>

        <input
            type="time"
            id="editStart">

        <label>Кінець сну</label>

        <input
            type="time"
            id="editEnd">

        <div class="rating-select">

            <p>Оцініть сон</p>

            <div class="stars" id="editRating">

                <span data-rating="1">⭐</span>
                <span data-rating="2">⭐</span>
                <span data-rating="3">⭐</span>
                <span data-rating="4">⭐</span>
                <span data-rating="5">⭐</span>

            </div>

        </div>

        <div class="mood-select">

            <p>Самопочуття</p>

            <div class="moods" id="editMoods">

                <button
                    type="button"
                    data-mood="😊">
                    😊
                </button>

                <button
                    type="button"
                    data-mood="😄">
                    😄
                </button>

                <button
                    type="button"
                    data-mood="😐">
                    😐
                </button>

                <button
                    type="button"
                    data-mood="😴">
                    😴
                </button>

                <button
                    type="button"
                    data-mood="😣">
                    😣
                </button>

            </div>

        </div>

        <textarea
            id="editDream"
            rows="3"
            placeholder="💭 Сон"></textarea>

        <textarea
            id="editNote"
            rows="3"
            placeholder="📝 Нотатка"></textarea>

        <button
            type="button"
            class="save-sleep"
            id="saveEditSleep">

            Зберегти зміни

        </button>

        <button
            type="button"
            class="close-modal"
            id="closeEditModal">

            Закрити

        </button>

    </div>

</div>


<!-- Спільний код меню та профілю -->

<script src="/js/common.js"></script>

<!-- Код самої сторінки історії -->

<script src="/js/history.js"></script>

</body>

</html>
